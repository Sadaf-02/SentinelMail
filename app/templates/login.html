{% extends "base.html" %}

{% block title %}Login - SentinelMail{% endblock %}

{% block content %}

<section class="py-5" style="min-height:90vh; display:flex; align-items:center;">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-8">

                <div class="card-custom p-5 shadow-lg">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-shield-halved text-info" style="font-size:4rem;"></i>

                        <h2 class="mt-3 fw-bold">SentinelMail</h2>

                        <p class="text-light">
                            Secure Login
                        </p>

                    </div>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">

                            <label class="form-label">
                                <i class="fa-solid fa-envelope me-2"></i>Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>
                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                <i class="fa-solid fa-lock me-2"></i>Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>

                        <div class="d-flex justify-content-between mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                <label
                                    class="form-check-label"
                                    for="remember">

                                    Remember Me

                                </label>

                            </div>
                            <a href="{{ url_for('forgot_password') }}" class="text-info text-decoration-none">
                                 Forgot Password?
                            </a>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-info text-dark fw-bold">

                                <i class="fa-solid fa-right-to-bracket me-2"></i>

                                Login

                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">

                        <p>

                            Don't have an account?

                            <a
                                href="{{ url_for('register') }}"
                                class="text-info text-decoration-none fw-bold">

                                Register Now

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
