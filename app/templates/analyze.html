{% extends "base.html" %}

{% block title %}Analyze Email - SentinelMail{% endblock %}

{% block content %}

<div class="container" style="margin-top:120px; margin-bottom:60px;">

    <div class="text-center mb-5">

        <i class="fa-solid fa-shield-halved text-info" style="font-size:70px;"></i>

        <h1 class="mt-3">
            AI Email Threat Scanner
        </h1>

        <p class="text-light">
            Paste an email or upload an .eml file to analyze it for phishing, spam, malicious links, and suspicious content.
        </p>

    </div>

    <div class="card-custom p-5">

        <form method="POST" action="/analyze">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="form-label fw-bold">

                <i class="fa-solid fa-envelope-open-text me-2"></i>

                Paste Email Content

            </label>

            <textarea
            name="email_text"
                class="form-control mb-4"
                rows="12"
                placeholder="Paste the complete email here..." required></textarea>

            <label class="form-label fw-bold">

                <i class="fa-solid fa-upload me-2"></i>

                Upload Email (.eml)

            </label>

            <input
                type="file"
                class="form-control mb-4">

            <div class="text-center">
                <button type="submit" class="btn btn-info btn-lg">
                    <i class="fa-solid fa-robot me-2"></i>
                    Analyze Email
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
