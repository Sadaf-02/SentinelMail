{% extends "base.html" %}

{% block title %}Register - SentinelMail{% endblock %}

{% block content %}

<section class="py-5" style="min-height:90vh; display:flex; align-items:center;">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="card-custom p-5 shadow-lg">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-user-shield text-info" style="font-size:4rem;"></i>

                        <h2 class="mt-3 fw-bold">Create Your SentinelMail Account</h2>

                        <p class="text-light">
                            Join our AI-powered email security platform.
                        </p>

                    </div>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">

                            <label class="form-label">
                                <i class="fa-solid fa-user me-2"></i>Full Name
                            </label>

                           <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>
                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                <i class="fa-solid fa-envelope me-2"></i>Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                <i class="fa-solid fa-lock me-2"></i>Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                <i class="fa-solid fa-lock me-2"></i>Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm your password"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-info text-dark fw-bold">

                                <i class="fa-solid fa-user-plus me-2"></i>

                                Create Account

                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">

                        <p>

                            Already have an account?

                            <a
                                href="{{ url_for('login') }}"
                                class="text-info text-decoration-none fw-bold">

                                Login Here

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
