{% extends "base.html" %}
{% block title %}Forgot Password - SentinelMail{% endblock %}
{% block content %}

<section class="py-5" style="min-height:90vh; display:flex; align-items:center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card-custom p-5 shadow-lg">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-key text-info"
                        style="font-size:4rem;"></i>
                        <h2 class="mt-3 fw-bold">
                            Forgot Password?
                        </h2>
                        <p class="text-light">
                            Enter your registered email address.
                        </p>
                        </div>

                    <form method="POST">

                        <input type="hidden"
                               name="csrf_token"
                               value="{{ csrf_token() }}">

                        <div class="mb-4">

                            <label class="form-label">
                                <i class="fa-solid fa-envelope me-2"></i>
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your registered email"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-info text-dark fw-bold">

                                <i class="fa-solid fa-paper-plane me-2"></i>
                                Send OTP

                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">

                        <a href="{{ url_for('login') }}"
                           class="text-info text-decoration-none">

                            <i class="fa-solid fa-arrow-left me-2"></i>
                            Back to Login

                        </a>
                    </div>                    
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
