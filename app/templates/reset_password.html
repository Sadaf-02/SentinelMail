{% extends "base.html" %}

{% block title %}Reset Password - SentinelMail{% endblock %}

{% block content %}

<section class="py-5" style="min-height:90vh; display:flex; align-items:center;">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-8">

                <div class="card-custom p-5 shadow-lg">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-lock text-info"
                           style="font-size:4rem;"></i>

                        <h2 class="mt-3 fw-bold">
                            Reset Password
                        </h2>

                        <p class="text-light">
                            Create a new password for your SentinelMail account.
                        </p>

                    </div>

                    <form method="POST">

                        <input type="hidden"
                               name="csrf_token"
                               value="{{ csrf_token() }}">

                        <div class="mb-3">

                            <label class="form-label">
                                New Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter new password"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm New Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm new password"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-info text-dark fw-bold">

                                <i class="fa-solid fa-key me-2"></i>
                                Reset Password

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
