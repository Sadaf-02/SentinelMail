{% extends "base.html" %}

{% block title %}Verify OTP - SentinelMail{% endblock %}

{% block content %}

<section class="py-5" style="min-height:90vh; display:flex; align-items:center;">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-8">

                <div class="card-custom p-5 shadow-lg">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-shield-halved text-info"
                           style="font-size:4rem;"></i>

                        <h2 class="mt-3 fw-bold">
                            Verify OTP
                        </h2>

                        <p class="text-light">
                            Enter the 6-digit OTP sent to your email.
                        </p>

                    </div>

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}">

                        <div class="mb-4">

                            <label class="form-label">

                                <i class="fa-solid fa-key me-2"></i>
                                OTP

                            </label>

                            <input
                                type="text"
                                name="otp"
                                class="form-control text-center"
                                placeholder="Enter 6-digit OTP"
                                maxlength="6"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-info text-dark fw-bold">

                                <i class="fa-solid fa-circle-check me-2"></i>
                                Verify OTP

                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">

                        <a
                            href="{{ url_for('forgot_password') }}"
                            class="text-info text-decoration-none">

                            <i class="fa-solid fa-arrow-left me-2"></i>
                            Request a New OTP

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
